<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fokus — Stanje</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/zavrsni/css/style.css">
</head>
<body class="page-fokus">

  <header class="mod-top-bar">
    <a class="natrag-link" href="/zavrsni/html/naslovna.html">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M19 12H5M5 12l7 7M5 12l7-7" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Natrag
    </a>
    <p class="mod-naslov">Fokus</p>
    <div class="sesija-prikaz">Sesija: <strong id="sesija-brojac">00:00</strong></div>
  </header>

  <p class="mod-subtitle">Rad bez distrakcija</p>

  <div class="fokus-main">
    <div class="fokus-grid">

      <div class="fokus-kartica">
        <p class="kartica-naslov">Odbrojavač</p>

        <div class="timer-ring-wrap">
          <svg class="timer-ring" viewBox="0 0 200 200">
            <circle class="timer-ring-track" cx="100" cy="100" r="90"/>
            <circle class="timer-ring-progress" cx="100" cy="100" r="90" id="ring-progress"/>
          </svg>
          <div class="timer-center">
            <div class="timer-display" id="timer-prikaz">25:00</div>
            <span class="timer-sub" id="timer-sub">minuta</span>
          </div>
        </div>

        <div class="timer-presets">
          <button class="timer-preset" data-preset="300">5 min</button>
          <button class="timer-preset aktivan" data-preset="1500">25 min</button>
          <button class="timer-preset" data-preset="3000">50 min</button>
        </div>

        <div class="timer-quick-row">
          <button class="timer-quick" data-dodaj="30">+0:30</button>
          <button class="timer-quick" data-dodaj="60">+1:00</button>
          <button class="timer-quick" data-dodaj="300">+5:00</button>
        </div>

        <button class="timer-gumb" id="timer-gumb">
          <svg viewBox="0 0 24 24" id="timer-ikona" fill="white">
            <polygon points="6,4 20,12 6,20"/>
          </svg>
          <span id="timer-gumb-tekst">Pokreni</span>
        </button>

        <button class="timer-reset" id="timer-reset">Resetiraj</button>
      </div>

      <div class="fokus-kartica">
        <p class="kartica-naslov">Zadaci</p>

        <div class="todo-input-row">
          <input class="todo-input" id="todo-input" type="text" placeholder="Dodaj zadatak..." maxlength="120" autocomplete="off">
          <button class="todo-dodaj" id="todo-dodaj" aria-label="Dodaj zadatak">
            <svg viewBox="0 0 24 24" fill="none">
              <line x1="12" y1="5" x2="12" y2="19" stroke="white" stroke-width="2.4" stroke-linecap="round"/>
              <line x1="5" y1="12" x2="19" y2="12" stroke="white" stroke-width="2.4" stroke-linecap="round"/>
            </svg>
          </button>
        </div>

        <div class="todo-progress-wrap" id="todo-progress-wrap" style="display:none">
          <div class="todo-progress-bar">
            <div class="todo-progress-fill" id="todo-progress-fill"></div>
          </div>
          <span class="todo-progress-tekst" id="todo-progress-tekst">0/0</span>
        </div>

        <ul class="todo-lista" id="todo-lista"></ul>
      </div>

    </div>

    <div class="quotes-wrap"><div class="quotes-box" id="quotes-box"></div></div>
  </div>

  <div class="trenutni-bar" id="trenutni-bar">
    <span class="bar-label">Trenutni zadatak</span>
    <span class="bar-naziv" id="bar-naziv"></span>
    <span class="bar-status bar-status--active" id="bar-status">U tijeku</span>
  </div>

  <script src="/zavrsni/js/fokus.js"></script>
  <script src="/zavrsni/js/citati.js"></script>
</body>
</html>
